name: Bestmile
description: >-
  Bestmile was a Swiss fleet-orchestration SaaS company, spun out of EPFL in Lausanne in 2014, whose
  cloud platform planned, dispatched and optimized mixed fleets of autonomous and human-driven
  vehicles for on-demand mobility and transit operators. The platform was described by the company as
  API-first, with documented Fleet, Booking and Transportation APIs for integrating operator booking
  apps, fleet-management systems and traveler-information systems. The company no longer operates: ZF
  Friedrichshafen acquired Bestmile's technology in November 2021 and folded it into its own SCALAR
  fleet-orchestration platform, so any successor API belongs to ZF rather than to Bestmile. As of
  2026-08-17 bestmile.com is a parked Gandi.net registrar domain that refuses HTTPS, and no
  developer portal, documentation, OpenAPI, package or /.well-known surface survives. Surfaced
  originally as a Partech portfolio company.
